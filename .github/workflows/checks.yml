name: Integration checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  operator-and-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-test-only
          POSTGRES_DB: sentinel_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Test the operator
        working-directory: packages/operator
        run: |
          npm ci
          npm test
      - name: Build and test the Sandbox wallet
        working-directory: packages/web
        run: |
          npm ci
          npm run build
          npm test
      - name: Test Master against PostgreSQL
        working-directory: packages/master
        env:
          SLA_MASTER_TEST_DATABASE_URL: postgresql://sentinel:sentinel-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/sentinel_test
        run: |
          npm ci
          npm test
