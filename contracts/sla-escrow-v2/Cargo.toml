[package]
name = "sla-escrow-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"
sla-quorum = { path = "../sla-quorum" }

[features]
sandbox-fixture = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
