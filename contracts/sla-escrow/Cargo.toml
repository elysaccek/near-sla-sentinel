[package]
name = "sla-escrow"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-workspaces = { version = "=0.24.0", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["non-contract-usage"] }

[features]
sandbox-tests = ["dep:near-workspaces", "dep:serde_json", "dep:tokio"]

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
required-features = ["sandbox-tests"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
